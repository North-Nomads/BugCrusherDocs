name: Build and Deploy DocFX Docs

on:
  repository_dispatch:
    types: [build-docs]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Checkout the SOURCE repository (BugCrusher)
      - name: Checkout BugCrusher source
        uses: actions/checkout@v4
        with:
          repository: North-Nomads/BugCrusher
          ref: ${{ github.event.client_payload.branch || 'main' }}
          token: ${{ secrets.DOCS_PAT }}
          path: source

      # Checkout THIS repository (BugCrusherDocs) for docfx.json
      - name: Checkout BugCrusherDocs config
        uses: actions/checkout@v4
        with:
          path: docs-config

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      # Install DocFX
      - name: Install DocFX
        run: dotnet tool update -g docfx

      # Build documentation
      - name: Build DocFX site
        run: |
          cd docs-config
          docfx docfx.json

      # Upload to GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs-config/_site'

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4